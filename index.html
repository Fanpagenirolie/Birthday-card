
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday! 🎂</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e7dff);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
    }

    /* Background glow */
    body::before {
      content: "";
      position: fixed;
      width: 400px;
      height: 400px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      filter: blur(80px);
      top: -100px;
      left: -100px;
    }

    body::after {
      content: "";
      position: fixed;
      width: 350px;
      height: 350px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      filter: blur(80px);
      bottom: -100px;
      right: -100px;
    }

    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 600px;
      padding: 45px 30px;
      text-align: center;
      border-radius: 30px;

      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 25px 60px rgba(0,0,0,0.2);
      backdrop-filter: blur(15px);

      animation: cardAppear 1s ease;
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(40px) scale(0.9);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cake {
      font-size: 80px;
      animation: bounce 2s infinite;
      margin-bottom: 10px;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    h1 {
      color: white;
      font-size: clamp(40px, 10vw, 70px);
      font-weight: 800;
      text-shadow: 0 5px 15px rgba(0,0,0,0.2);
      margin-bottom: 15px;
    }

    .name {
      color: #fff6a8;
    }

    .subtitle {
      color: white;
      font-size: clamp(18px, 4vw, 23px);
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .message {
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 20px;
      color: white;
      font-size: 17px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    button {
      border: none;
      outline: none;
      padding: 15px 30px;
      border-radius: 50px;
      background: white;
      color: #ff4f81;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;

      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.07);
      box-shadow: 0 12px 25px rgba(0,0,0,0.25);
    }

    button:active {
      transform: scale(0.95);
    }

    .footer {
      margin-top: 25px;
      color: rgba(255,255,255,0.8);
      font-size: 14px;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 15px;
      z-index: 20;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* Balloons */
    .balloon {
      position: fixed;
      bottom: -120px;
      font-size: 55px;
      animation: floatUp linear infinite;
      opacity: 0.8;
      pointer-events: none;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(-5deg);
      }

      50% {
        transform: translateY(-50vh) rotate(5deg);
      }

      100% {
        transform: translateY(-120vh) rotate(-5deg);
      }
    }

    /* Mobile */
    @media (max-width: 600px) {

      body {
        padding: 15px;
      }

      .card {
        padding: 35px 20px;
        border-radius: 25px;
      }

      .cake {
        font-size: 65px;
      }

      .message {
        font-size: 16px;
        padding: 17px;
      }

      button {
        width: 100%;
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="cake">🎂</div>

    <h1>
      Happy Birthday! 🎉
    </h1>

    <p class="subtitle">
      Wishing you an amazing birthday,
      <span class="name">[ROLIE]</span>! 💖
    </p>

    <div class="message">
      May your special day be filled with
      happiness, laughter, love, and unforgettable
      memories. ✨

      <br><br>

      May all your dreams come true and may
      this new year of your life bring you
      countless blessings! 🥳🎁
    </div>

    <button onclick="celebrate()">
      🎉 Celebrate!
    </button>

    <div class="footer">
      Made with ❤️ just for you
    </div>

  </div>


  <script>

    // Create confetti
    function createConfetti(amount = 150) {

      const colors = [
        "#ff4757",
        "#ffa502",
        "#2ed573",
        "#1e90ff",
        "#a55eea",
        "#ff6b81",
        "#ffeaa7"
      ];

      for (let i = 0; i < amount; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.width =
          Math.random() * 8 + 6 + "px";

        confetti.style.height =
          Math.random() * 12 + 6 + "px";

        confetti.style.animationDuration =
          Math.random() * 3 + 2 + "s";

        confetti.style.animationDelay =
          Math.random() * 0.5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);
      }
    }


    // Celebration button
    function celebrate() {

      createConfetti(250);

      // Create extra balloons
      for (let i = 0; i < 10; i++) {

        const balloon = document.createElement("div");

        balloon.classList.add("balloon");

        balloon.innerHTML =
          ["🎈", "🎈", "🎈", "🎁", "✨"][Math.floor(Math.random() * 5)];

        balloon.style.left =
          Math.random() * 100 + "vw";

        balloon.style.animationDuration =
          Math.random() * 5 + 5 + "s";

        balloon.style.animationDelay =
          Math.random() * 2 + "s";

        document.body.appendChild(balloon);

        setTimeout(() => {
          balloon.remove();
        }, 10000);
      }
    }


    // Automatic confetti when page opens
    window.onload = function() {
      createConfetti(100);
    };

  </script>

</body>
</html>
